  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  topic:'Regulations & compliance', title:'CSRD: what boards need to know'},\n    {type:'video',    topic:'Regulations & compliance', title:'Sanctions screening under EU pressure'},\n    {type:'template', topic:'Board leadership',         title:'Board skills matrix and competency assessment'},\n    {type:'template', topic:'Risk management',          title:'Cyber-risk dashboard template'},\n    {type:'video',    topic:'Risk management',          title:'ESG reporting under CSRD — what boards need to know'},\n    {type:'course',   topic:'Risk management',          title:'Quantifying operational risk for boards'},\n    {type:'path',     topic:'Risk management',          title:'From risk register to board paper'},\n    {type:'template', topic:'Board leadership',         title:'Director induction checklist — first 90 days'},\n    {type:'template', topic:'Regulations & compliance', title:'Whistleblowing policy — UK & EU template'},\n    {type:'course',   topic:'Board leadership',         title:'Chairing the AGM — a practitioner course'}\n  ];\n  var ICONS  = {template:'description', course:'school', video:'play_circle', path:'route'};\n  var LABELS = {template:'Template',    course:'Course', video:'Video',       path:'Learning path'};\n\n  function esc(s){ return String(s).replace(/[<>&\"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','\"':'&quot;'}[c]; }); }\n  function regexEsc(s){ return s.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&'); }\n  function highlight(text, q){\n    if (!q) return esc(text);\n    var safe = esc(text);\n    var safeQ = regexEsc(esc(q));\n    return safe.replace(new RegExp('('+safeQ+')', 'ig'), '<mark>$1<\u002Fmark>');\n  }\n\n  function init(input){\n    if (input.dataset.sdInit) return;\n    input.dataset.sdInit = '1';\n    var shell = input.closest('.search-shell');\n    if (!shell){\n      shell = input.parentNode;\n      shell.style.position = 'relative';\n    }\n    var dd = document.createElement('div');\n    dd.className = 'search-dropdown';\n    shell.appendChild(dd);\n\n    var activeIdx = -1;\n    var matches = [];\n\n    function render(q){\n      q = (q || '').trim();\n      if (!q){ dd.classList.remove('on'); dd.innerHTML=''; return; }\n      var lower = q.toLowerCase();\n      matches = ITEMS.filter(function(it){\n        return it.title.toLowerCase().indexOf(lower) !== -1\n            || it.topic.toLowerCase().indexOf(lower) !== -1\n            || LABELS[it.type].toLowerCase().indexOf(lower) !== -1;\n      });\n      activeIdx = -1;\n      var top = matches.slice(0, 7);\n      var html = '';\n      if (top.length === 0){\n        html = '<div class=\"sd-empty\"><span class=\"ms\">search_off<\u002Fspan>'+\n               '<strong>No matches for &ldquo;'+esc(q)+'&rdquo;<\u002Fstrong>'+\n               'Try a different keyword, or browse the full library.<\u002Fdiv>';\n      } else {\n        html = '<div class=\"sd-label\"><span>Suggestions · '+top.length+' of '+matches.length+'<\u002Fspan><span class=\"kbd\">↑ ↓ to navigate &nbsp;·&nbsp; ↵ to open<\u002Fspan><\u002Fdiv>';\n        top.forEach(function(it, i){\n          html += '<button class=\"sd-row\" data-i=\"'+i+'\">'+\n            '<div class=\"sd-ico t-'+it.type+'\"><span class=\"ms\">'+ICONS[it.type]+'<\u002Fspan><\u002Fdiv>'+\n            '<div class=\"sd-info\">'+\n              '<div class=\"t\">'+highlight(it.title, q)+'<\u002Fdiv>'+\n              '<div class=\"m\">'+esc(LABELS[it.type])+' &middot; '+esc(it.topic)+'<\u002Fdiv>'+\n            '<\u002Fdiv>'+\n            '<div class=\"sd-tag\">'+esc(LABELS[it.type])+'<\u002Fdiv>'+\n          '<\u002Fbutton>';\n        });\n        html += '<button class=\"sd-foot\"><span>Show all '+matches.length+' results for &ldquo;'+esc(q)+'&rdquo;<\u002Fspan><span class=\"ms\">arrow_forward<\u002Fspan><\u002Fbutton>';\n      }\n      dd.innerHTML = html;\n      dd.classList.add('on');\n      // Wire row clicks (visual prototype only — fill input)\n      dd.querySelectorAll('.sd-row').forEach(function(r){\n        r.addEventListener('click', function(){\n          var idx = parseInt(r.dataset.i, 10);\n          if (!isNaN(idx) && matches[idx]){ input.value = matches[idx].title; render(input.value); }\n        });\n      });\n    }\n\n    input.addEventListener('input', function(){ render(input.value); });\n    input.addEventListener('focus', function(){ if (input.value.trim()) render(input.value); });\n\n    document.addEventListener('mousedown', function(e){\n      if (!shell.contains(e.target)) dd.classList.remove('on');\n    });\n\n    input.addEventListener('keydown', function(e){\n      if (!dd.classList.contains('on')) return;\n      var rows = dd.querySelectorAll('.sd-row');\n      if (!rows.length) return;\n      if (e.key === 'ArrowDown'){ e.preventDefault(); activeIdx = (activeIdx + 1) % rows.length; }\n      else if (e.key === 'ArrowUp'){ e.preventDefault(); activeIdx = (activeIdx - 1 + rows.length) % rows.length; }\n      else if (e.key === 'Escape'){ dd.classList.remove('on'); return; }\n      else if (e.key === 'Enter'){ e.preventDefault(); if (rows[activeIdx]) rows[activeIdx].click(); return; }\n      else return;\n      rows.forEach(function(r, i){ r.classList.toggle('on', i === activeIdx); });\n    });\n  }\n\n  function bind(){\n    document.querySelectorAll('.search-big input').forEach(init);\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);\n  else bind();\n})();\n\n<\\/script>\n<\u002Fbody>\n<\u002Fhtml>\n\n<\u002Fscript>\n<script type=\"application/x-concept\" id=\"c-B\">\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\" />\n<title>Diligent Learning Hub — Concept 2 v3-B<\u002Ftitle>\n<meta name=\"viewport\" content=\"width=1280\" />\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\" />\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200\" rel=\"stylesheet\" />\n<style data-shared>\n/* ============ DILIGENT LEARNING HUB — SHARED TOKENS + CHROME ============ */\n:root{\n  --red:#EE312E;\n  --red-ink:#C32320;\n  --red-soft:#FCE9E8;\n  --g1:#F3F3F3;\n  --g2:#E2E4E8;\n  --g3:#B6BAC2;\n  --g4:#6C7281;\n  --g5:#282E37;\n  --ink:#1A1F27;\n  --blue:#0B4CCE;\n  --page:#FFFFFF;\n  --line:#E6E8EC;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0;background:var(--page);color:var(--ink);font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\nbody{min-width:1280px}\na{color:var(--blue);text-decoration:none}\na:hover{text-decoration:underline}\n.mono{font-family:\"JetBrains Mono\",ui-monospace,monospace}\n.ms{font-family:\"Material Symbols Sharp\";font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;white-space:nowrap;direction:ltr;vertical-align:middle;font-feature-settings:\"liga\";-webkit-font-smoothing:antialiased;font-variation-settings:\"FILL\" 0,\"wght\" 400,\"GRAD\" 0,\"opsz\" 24}\n.ms.fill{font-variation-settings:\"FILL\" 1,\"wght\" 500,\"GRAD\" 0,\"opsz\" 24}\nbutton{font:inherit}\n\n/* ============ NAV ============ */\n.nav{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;padding:0 40px;gap:48px}\n.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-0.01em;color:var(--g5)}\n.logo-mark{width:24px;height:24px;background:var(--red);border-radius:2px;display:inline-block;position:relative}\n.logo-mark::after{content:\"\";position:absolute;inset:6px 6px auto auto;width:8px;height:8px;background:#fff}\n.nav-links{display:flex;gap:32px;margin:0 auto}\n.nav-links a{color:var(--g5);font-wei nalising your group structure'},\n    {type:'template', topic:'Board leadership',         title:'Board pack agenda — quarterly'},\n    {type:'template', topic:'Board leadership',         title:'Board evaluation questionnaire'},\n    {type:'video',    topic:'Board leadership',         title:'Designing effective committees'},\n    {type:'course',   topic:'Regulations & compliance', title:'CSRD: what boards need to know'},\n    {type:'video',    topic:'Regulations & compliance', title:'Sanctions screening under EU pressure'},\n    {type:'template', topic:'Board leadership',         title:'Board skills matrix and competency assessment'},\n    {type:'template', topic:'Risk management',          title:'Cyber-risk dashboard template'},\n    {type:'video',    topic:'Risk management',          title:'ESG reporting under CSRD — what boards need to know'},\n    {type:'course',   topic:'Risk management',          title:'Quantifying operational risk for boards'},\n    {type:'path',     topic:'Risk management',          title:'From risk register to board paper'},\n    {type:'template', topic:'Board leadership',         title:'Director induction checklist — first 90 days'},\n    {type:'template', topic:'Regulations & compliance', title:'Whistleblowing policy — UK & EU template'},\n    {type:'course',   topic:'Board leadership',         title:'Chairing the AGM — a practitioner course'}\n  ];\n  var ICONS  = {template:'description', course:'school', video:'play_circle', path:'route'};\n  var LABELS = {template:'Template',    course:'Course', video:'Video',       path:'Learning path'};\n\n  function esc(s){ return String(s).replace(/[<>&\"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','\"':'&quot;'}[c]; }); }\n  function regexEsc(s){ return s.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&'); }\n  function highlight(text, q){\n    if (!q) return esc(text);\n    var safe = esc(text);\n    var safeQ = regexEsc(esc(q));\n    return safe.replace(new RegExp('('+safeQ+')', 'ig'), '<mark>$1<\u002Fmark>');\n  }\n\n  function init(input){\n    if (input.dataset.sdInit) return;\n    input.dataset.sdInit = '1';\n    var shell = input.closest('.search-shell');\n    if (!shell){\n      shell = input.parentNode;\n      shell.style.position = 'relative';\n    }\n    var dd = document.createElement('div');\n    dd.className = 'search-dropdown';\n    shell.appendChild(dd);\n\n    var activeIdx = -1;\n    var matches = [];\n\n    function render(q){\n      q = (q || '').trim();\n      if (!q){ dd.classList.remove('on'); dd.innerHTML=''; return; }\n      var lower = q.toLowerCase();\n      matches = ITEMS.filter(function(it){\n        return it.title.toLowerCase().indexOf(lower) !== -1\n            || it.topic.toLowerCase().indexOf(lower) !== -1\n            || LABELS[it.type].toLowerCase().indexOf(lower) !== -1;\n      });\n      activeIdx = -1;\n      var top = matches.slice(0, 7);\n      var html = '';\n      if (top.length === 0){\n        html = '<div class=\"sd-empty\"><span class=\"ms\">search_off<\u002Fspan>'+\n               '<strong>No matches for &ldquo;'+esc(q)+'&rdquo;<\u002Fstrong>'+\n               'Try a different keyword, or browse the full library.<\u002Fdiv>';\n      } else {\n        html = '<div class=\"sd-label\"><span>Suggestions · '+top.length+' of '+matches.length+'<\u002Fspan><span class=\"kbd\">↑ ↓ to navigate &nbsp;·&nbsp; ↵ to open<\u002Fspan><\u002Fdiv>';\n        top.forEach(function(it, i){\n          html += '<button class=\"sd-row\" data-i=\"'+i+'\">'+\n            '<div class=\"sd-ico t-'+it.type+'\"><span class=\"ms\">'+ICONS[it.type]+'<\u002Fspan><\u002Fdiv>'+\n            '<div class=\"sd-info\">'+\n              '<div class=\"t\">'+highlight(it.title, q)+'<\u002Fdiv>'+\n              '<div class=\"m\">'+esc(LABELS[it.type])+' &middot; '+esc(it.topic)+'<\u002Fdiv>'+\n            '<\u002Fdiv>'+\n            '<div class=\"sd-tag\">'+esc(LABELS[it.type])+'<\u002Fdiv>'+\n          '<\u002Fbutton>';\n        });\n        html += '<button class=\"sd-foot\"><span>Show all '+matches.length+' results for &ldquo;'+esc(q)+'&rdquo;<\u002Fspan><span class=\"ms\">arrow_forward<\u002Fspan><\u002Fbutton>';\n      }\n      dd.innerHTML = html;\n      dd.classList.add('on');\n      // Wire row clicks (visual prototype only — fill input)\n      dd.querySelectorAll('.sd-row').forEach(function(r){\n        r.addEventListener('click', function(){\n          var idx = parseInt(r.dataset.i, 10);\n          if (!isNaN(idx) && matches[idx]){ input.value = matches[idx].title; render(input.value); }\n        });\n      });\n    }\n\n    input.addEventListener('input', function(){ render(input.value); });\n    input.addEventListener('focus', function(){ if (input.value.trim()) render(input.value); });\n\n    document.addEventListener('mousedown', function(e){\n      if (!shell.contains(e.target)) dd.classList.remove('on');\n    });\n\n    input.addEventListener('keydown', function(e){\n      if (!dd.classList.contains('on')) return;\n      var rows = dd.querySelectorAll('.sd-row');\n      if (!rows.length) return;\n      if (e.key === 'ArrowDown'){ e.preventDefault(); activeIdx = (activeIdx + 1) % rows.length; }\n      else if (e.key === 'ArrowUp'){ e.preventDefault(); activeIdx = (activeIdx - 1 + rows.length) % rows.length; }\n      else if (e.key === 'Escape'){ dd.classList.remove('on'); return; }\n      else if (e.key === 'Enter'){ e.preventDefault(); if (rows[activeIdx]) rows[activeIdx].click(); return; }\n      else return;\n      rows.forEach(function(r, i){ r.classList.toggle('on', i === activeIdx); });\n    });\n  }\n\n  function bind(){\n    document.querySelectorAll('.search-big input').forEach(init);\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);\n  else bind();\n})();\n\n<\\/script>\n<\u002Fbody>\n<\u002Fhtml>\n\n<\u002Fscript>\n<script type=\"application/x-concept\" id=\"c-C\">\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\" />\n<title>Diligent Learning Hub — Concept 2 v3-C<\u002Ftitle>\n<meta name=\"viewport\" content=\"width=1280\" />\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\" />\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200\" rel=\"stylesheet\" />\n<style data-shared>\n/* ============ DILIGENT LEARNING HUB — SHARED TOKENS + CHROME ============ */\n:root{\n  --red:#EE312E;\n  --red-ink:#C32320;\n  --red-soft:#FCE9E8;\n  --g1:#F3F3F3;\n  --g2:#E2E4E8;\n  --g3:#B6BAC2;\n  --g4:#6C7281;\n  --g5:#282E37;\n  --ink:#1A1F27;\n  --blue:#0B4CCE;\n  --page:#FFFFFF;\n  --line:#E6E8EC;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0;background:var(--page);color:var(--ink);font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\nbody{min-width:1280px}\na{color:var(--blue);text-decoration:none}\na:hover{text-decoration:underline}\n.mono{font-family:\"JetBrains Mono\",ui-monospace,monospace}\n.ms{font-family:\"Material Symbols Sharp\";font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;white-space:nowrap;direction:ltr;vertical-align:middle;font-feature-settings:\"liga\";-webkit-font-smoothing:antialiased;font-variation-settings:\"FILL\" 0,\"wght\" 400,\"GRAD\" 0,\"opsz\" 24}\n.ms.fill{font-variation-settings:\"FILL\" 1,\"wght\" 500,\"GRAD\" 0,\"opsz\" 24}\nbutton{font:inherit}\n\n/* ============ NAV ============ */\n.nav{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;padding:0 40px;gap:48px}\n.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-0.01em;color:var(--g5)}\n.logo-mark{width:24px;height:24px;background:var(--red);border-radius:2px;display:inline-block;position:relative}\n.logo-mark::after{content:\"\";position:absolute;inset:6px 6px auto auto;width:8px;height:8px;background:#fff}\n.nav-links{display:flex;gap:32px;margin:0 auto}\n.nav-links a{color:var(--g5);font-weight:500;font-size:15px}\n.nav-links a.active{color:var(--red)}\n.nav-right{display:flex;align-items:center;gap:20px}\n.nav-right a{color:var(--g5);font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px}\n.nav-btn{background:var(--g5);color:#fff !important;padding:9px 16px;border-radius:2px;font-size:14px;font-weight:600}\n.nav-btn:hover{text-decoration:none;background:#000}\n\n/* ============ CERTIFICATIONS STRIP ============ */\n.cert-strip{border-top:1px solid var(--line);background:var(--g1);padding:32px 40px}\n.cert-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:40px}\n.cert-inner h3{margin:0;font-size:20px;font-weight:700;color:var(--g5);letter-spacing:-0.01em;line-height:1.2;flex-shrink:0;max-width:280px}\n.cert-inner h3 small{display:block;font-size:12px;font-weight:500;color:var(--g4);font-family:\"JetBrains Mono\",monospace;letter-spacing:0.08em;margin-top:6px;text-transform:uppercase}\n.badges{display:flex;gap:14px;flex:1}\n.badge{flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--g5);line-height:1.25}\n.badge .ms{font-size:22px;color:var(--red);flex-shrink:0}\n.cert-cta{flex-shrink:0;display:flex;align-items:center;gap:8px;color:var(--g5);font-weight:600;font-size:14px;text-decoration:none;border-bottom:2px solid var(--red);padding-bottom:4px}\n\n/* ============ DEMO CTA ============ */\n.demo{background:var(--g5);color:#fff;padding:48px 40px;border-top:4px solid var(--red)}\n.demo-inner{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:1fr 1.2fr;gap:64px;align-items:center}\n.demo h2{margin:0 0 14px;font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1.15}\n.demo p{margin:0;color:#B6BAC2;font-size:15px;line-height:1.5;max-width:480px}\n.demo p a{color:#fff;border-bottom:1px solid var(--red)}\n.demo-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.demo-form .full{grid-column:1/-1}\n.demo-form input,.demo-form select{height:44px;background:#1B2027;border:1px solid #3a4150;color:#fff;font:inherit;font-size:14px;padding:0 12px;outline:0;border-radius:2px}\n.demo-form input::placeholder{color:#7a818d}\n.demo-form .submit{background:var(--red);color:#fff;border:0;font-weight:600;font-size:14px;height:44px;cursor:pointer;letter-spacing:0.02em}\n.demo-form .submit:hover{background:var(--red-ink)}\n.demo-form .fine{grid-column:1/-1;font-size:11px;color:#7a818d;line-height:1.5}\n\n/* ============ FOOTER ============ */\nfooter{background:#1A1F27;color:#B6BAC2;padding:48px 40px 24px}\n.foot-inner{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:48px}\n.foot-col h4{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#fff;margin:0 0 16px;font-family:\"JetBrains Mono\",monospace}\n.foot-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}\n.foot-col a{color:#B6BAC2;font-size:14px}\n.foot-col a:hover{color:#fff;text-decoration:none}\n.foot-brand .logo{color:#fff;margin-bottom:16px}\n.foot-brand p{font-size:13px;line-height:1.6;color:#7a818d;max-width:300px;margin:0 0 20px}\n.socials{display:flex;gap:10px}\n.socials a{width:36px;height:36px;border:1px solid #3a4150;display:flex;align-items:center;justify-content:center;color:#B6BAC2}\n.socials a:hover{background:var(--red);border-color:var(--red);color:#fff}\n.copyline{max-width:1600px;margin:40px auto 0;padding-top:20px;border-top:1px solid #2a313c;display:flex;justify-content:space-between;font-size:12px;color:#7a818d}\n\n/* ============ THUMB COLORS (s n(function(){\n  var ITEMS = [\n    {type:'template', topic:'Risk management',          title:'AI ethics board agenda and discussion template'},\n    {type:'video',    topic:'Risk management',          title:'Developing risk appetite: a framework for boards'},\n    {type:'course',   topic:'Risk management',          title:'Cybersecurity oversight for non-technical directors'},\n    {type:'path',     topic:'Board leadership',         title:'The first-time board director — a foundational path'},\n    {type:'template', topic:'Board leadership',         title:'Shareholder resolution tracker template'},\n    {type:'video',    topic:'Board leadership',         title:'Annual general meetings (AGMs) explained'},\n    {type:'template', topic:'Risk management',          title:'EU AI Act board readiness checklist'},\n    {type:'course',   topic:'Risk management',          title:'NIS2 board oversight playbook'},\n    {type:'video',    topic:'Regulations & compliance', title:'Climate-risk disclosure walkthrough under CSRD'},\n    {type:'path',     topic:'Regulations & compliance', title:'IPO readiness — a 12-month roadmap'},\n    {type:'template', topic:'Entity management',        title:'Subsidiary governance dashboard'},\n    {type:'course',   topic:'Board leadership',         title:'Executive compensation in 2026'},\n    {type:'template', topic:'Regulations & compliance', title:'Conflict of interest declaration — annual review'},\n    {type:'template', topic:'Risk management',          title:'Enterprise risk register — board-level view'},\n    {type:'video',    topic:'Risk management',          title:'Three lines of defence: still fit for purpose?'},\n    {type:'course',   topic:'Entity management',        title:'Entity management essentials for company secretaries'},\n    {type:'template', topic:'Entity management',        title:'Statutory filings calendar'},\n    {type:'video',    topic:'Entity management',        title:'Rationalising your group structure'},\n    {type:'template', topic:'Board leadership',         title:'Board pack agenda — quarterly'},\n    {type:'template', topic:'Board leadership',         title:'Board evaluation questionnaire'},\n    {type:'video',    topic:'Board leadership',         title:'Designing effective committees'},\n    {type:'course',   topic:'Regulations & compliance', title:'CSRD: what boards need to know'},\n    {type:'video',    topic:'Regulations & compliance', title:'Sanctions screening under EU pressure'},\n    {type:'template', topic:'Board leadership',         title:'Board skills matrix and competency assessment'},\n    {type:'template', topic:'Risk management',          title:'Cyber-risk dashboard template'},\n    {type:'video',    topic:'Risk management',          title:'ESG reporting under CSRD — what boards need to know'},\n    {type:'course',   topic:'Risk management',          title:'Quantifying operational risk for boards'},\n    {type:'path',     topic:'Risk management',          title:'From risk register to board paper'},\n    {type:'template', topic:'Board leadership',         title:'Director induction checklist — first 90 days'},\n    {type:'template', topic:'Regulations & compliance', title:'Whistleblowing policy — UK & EU template'},\n    {type:'course',   topic:'Board leadership',         title:'Chairing the AGM — a practitioner course'}\n  ];\n  var ICONS  = {template:'description', course:'school', video:'play_circle', path:'route'};\n  var LABELS = {template:'Template',    course:'Course', video:'Video',       path:'Learning path'};\n\n  function esc(s){ return String(s).replace(/[<>&\"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','\"':'&quot;'}[c]; }); }\n  function regexEsc(s){ return s.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&'); }\n  function highlight(text, q){\n    if (!q) return esc(text);\n    var safe = esc(text);\n    var safeQ = regexEsc(esc(q));\n    return safe.replace(new RegExp('('+safeQ+')', 'ig'), '<mark>$1<\u002Fmark>');\n  }\n\n  function init(input){\n    if (input.dataset.sdInit) return;\n    input.dataset.sdInit = '1';\n    var shell = input.closest('.search-shell');\n    if (!shell){\n      shell = input.parentNode;\n      shell.style.position = 'relative';\n    }\n    var dd = document.createElement('div');\n    dd.className = 'search-dropdown';\n    shell.appendChild(dd);\n\n    var activeIdx = -1;\n    var matches = [];\n\n    function render(q){\n      q = (q || '').trim();\n      if (!q){ dd.classList.remove('on'); dd.innerHTML=''; return; }\n      var lower = q.toLowerCase();\n      matches = ITEMS.filter(function(it){\n        return it.title.toLowerCase().indexOf(lower) !== -1\n            || it.topic.toLowerCase().indexOf(lower) !== -1\n            || LABELS[it.type].toLowerCase().indexOf(lower) !== -1;\n      });\n      activeIdx = -1;\n      var top = matches.slice(0, 7);\n      var html = '';\n      if (top.length === 0){\n        html = '<div class=\"sd-empty\"><span class=\"ms\">search_off<\u002Fspan>'+\n               '<strong>No matches for &ldquo;'+esc(q)+'&rdquo;<\u002Fstrong>'+\n               'Try a different keyword, or browse the full library.<\u002Fdiv>';\n      } else {\n        html = '<div class=\"sd-label\"><span>Suggestions · '+top.length+' of '+matches.length+'<\u002Fspan><span class=\"kbd\">↑ ↓ to navigate &nbsp;·&nbsp; ↵ to open<\u002Fspan><\u002Fdiv>';\n        top.forEach(function(it, i){\n          html += '<button class=\"sd-row\" data-i=\"'+i+'\">'+\n            '<div class=\"sd-ico t-'+it.type+'\"><span class=\"ms\">'+ICONS[it.type]+'<\u002Fspan><\u002Fdiv>'+\n            '<div class=\"sd-info\">'+\n              '<div class=\"t\">'+highlight(it.title, q)+'<\u002Fdiv>'+\n              '<div class=\"m\">'+esc(LABELS[it.type])+' &middot; '+esc(it.topic)+'<\u002Fdiv>'+\n            '<\u002Fdiv>'+\n            '<div class=\"sd-tag\">'+esc(LABELS[it.type])+'<\u002Fdiv>'+\n          '<\u002Fbutton>';\n        });\n        html += '<button class=\"sd-foot\"><span>Show all '+matches.length+' results for &ldquo;'+esc(q)+'&rdquo;<\u002Fspan><span class=\"ms\">arrow_forward<\u002Fspan><\u002Fbutton>';\n      }\n      dd.innerHTML = html;\n      dd.classList.add('on');\n      // Wire row clicks (visual prototype only — fill input)\n      dd.querySelectorAll('.sd-row').forEach(function(r){\n        r.addEventListener('click', function(){\n          var idx = parseInt(r.dataset.i, 10);\n          if (!isNaN(idx) && matches[idx]){ input.value = matches[idx].title; render(input.value); }\n        });\n      });\n    }\n\n    input.addEventListener('input', function(){ render(input.value); });\n    input.addEventListener('focus', function(){ if (input.value.trim()) render(input.value); });\n\n    document.addEventListener('mousedown', function(e){\n      if (!shell.contains(e.target)) dd.classList.remove('on');\n    });\n\n    input.addEventListener('keydown', function(e){\n      if (!dd.classList.contains('on')) return;\n      var rows = dd.querySelectorAll('.sd-row');\n      if (!rows.length) return;\n      if (e.key === 'ArrowDown'){ e.preventDefault(); activeIdx = (activeIdx + 1) % rows.length; }\n      else if (e.key === 'ArrowUp'){ e.preventDefault(); activeIdx = (activeIdx - 1 + rows.length) % rows.length; }\n      else if (e.key === 'Escape'){ dd.classList.remove('on'); return; }\n      else if (e.key === 'Enter'){ e.preventDefault(); if (rows[activeIdx]) rows[activeIdx].click(); return; }\n      else return;\n      rows.forEach(function(r, i){ r.classList.toggle('on', i === activeIdx); });\n    });\n  }\n\n  function bind(){\n    document.querySelectorAll('.search-big input').forEach(init);\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);\n  else bind();\n})();\n\n<\\/script>\n<\u002Fbody>\n<\u002Fhtml>\n\n<\u002Fscript>\n<script type=\"application/x-concept\" id=\"c-D\">\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\" />\n<title>Diligent Learning Hub — Concept 2 v3-D<\u002Ftitle>\n<meta name=\"viewport\" content=\"width=1280\" />\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\" />\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200\" rel=\"stylesheet\" />\n<style data-shared>\n/* ============ DILIGENT LEARNING HUB — SHARED TOKENS + CHROME ============ */\n:root{\n  --red:#EE312E;\n  --red-ink:#C32320;\n  --red-soft:#FCE9E8;\n  --g1:#F3F3F3;\n  --g2:#E2E4E8;\n  --g3:#B6BAC2;\n  --g4:#6C7281;\n  --g5:#282E37;\n  --ink:#1A1F27;\n  --blue:#0B4CCE;\n  --page:#FFFFFF;\n  --line:#E6E8EC;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0;background:var(--page);color:var(--ink);font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\nbody{min-width:1280px}\na{color:var(--blue);text-decoration:none}\na:hover{text-decoration:underline}\n.mono{font-family:\"JetBrains Mono\",ui-monospace,monospace}\n.ms{font-family:\"Material Symbols Sharp\";font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;white-space:nowrap;direction:ltr;vertical-align:middle;font-feature-settings:\"liga\";-webkit-font-smoothing:antialiased;font-variation-settings:\"FILL\" 0,\"wght\" 400,\"GRAD\" 0,\"opsz\" 24}\n.ms.fill{font-variation-settings:\"FILL\" 1,\"wght\" 500,\"GRAD\" 0,\"opsz\" 24}\nbutton{font:inherit}\n\n/* ============ NAV ============ */\n.nav{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;padding:0 40px;gap:48px}\n.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-0.01em;color:var(--g5)}\n.logo-mark{width:24px;height:24px;background:var(--red);border-radius:2px;display:inline-block;position:relative}\n.logo-mark::after{content:\"\";position:absolute;inset:6px 6px auto auto;width:8px;height:8px;background:#fff}\n.nav-links{display:flex;gap:32px;margin:0 auto}\n.nav-links a{color:var(--g5);font-weight:500;font-size:15px}\n.nav-links a.active{color:var(--red)}\n.nav-right{display:flex;align-items:center;gap:20px}\n.nav-right a{color:var(--g5);font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px}\n.nav-btn{background:var(--g5);color:#fff !important;padding:9px 16px;border-radius:2px;font-size:14px;font-weight:600}\n.nav-btn:hover{text-decoration:none;background:#000}\n\n/* ============ CERTIFICATIONS STRIP ============ */\n.cert-strip{border-top:1px solid var(--line);background:var(--g1);padding:32px 40px}\n.cert-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:40px}\n.cert-inner h3{margin:0;font-size:20px;font-weight:700;color:var(--g5);letter-spacing:-0.01em;line-height:1.2;flex-shrink:0;max-width:280px}\n.cert-inner h3 small{display:block;font-size:12px;font-weight:500;color:var(--g4);font-family:\"JetBrains Mono\",monospace;letter-spacing:0.08em;margin-top:6px;text-transform:uppercase}\n.badges{display:flex;gap:14px;flex:1}\n.badge{flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--g5);line-height:1.25}\n.badge .ms{font-size:22px;color:var(--red);flex-shrink:0}\n.cert-cta{flex-shrink:0;display:flex;align-items:center;gap:8px;color:var(--g5);font-weight:600;font-size:14px;text-decoration:none;border-bottom:2px solid var(--red);padding-bottom:4px}\n\n/* ============ DEMO CTA ============ */\n.demo{background:var(--g5);color:#fff;padding:48px 40px;border-top:4px solid var(--red)}\n.demo-inner{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:1fr 1.2fr;gap:64px;align-items:center}\n.demo h2{margin:0 0 14px;font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1.15}\n.demo p{margin:0;color:#B6BAC2;font-size:15px;line-height:1.5;max-width:480px}\n.demo p a{color:#fff;border-bottom:1px solid var(--red)}\n.demo-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.demo-form .full{grid-column:1/-1}\n.demo-form input,.demo-form select{height:44px;background:#1B2027;border:1px solid #3a4150;color:#fff;font:inherit;font-size:14px;padding:0 12px;outline:0;border-radius:2px}\n.demo-form input::placeholder{color:#7a818d}\n.demo-form .submit{background:var(--red);color:#fff;border:0;font-weight:600;font-size:14px;height:44px;cursor:pointer;letter-spacing:0.02em}\n.demo-form .submit:hover{background:var(--red-ink)}\n.demo-form .fine{grid-column:1/-1;font-size:11px;color:#7a818d;line-height:1.5}\n\n/* ============ FOOTER ============ */\nfooter{background:#1A1F27;color:#B6BAC2;padding:48px 40px 24px}\n.foot-inner{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:48px}\n.foot-col h4{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#fff;margin:0 0 16px;font-family:\"JetBrains Mono\",monospace}\n.foot-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}\n.foot-col a{color:#B6BAC2;font-size:14px}\n.foot-col a:hover{color:#fff;text-decoration:none}\n.foot-brand .logo{color:#fff;margin-bottom:16px}\n.foot-brand p{font-size:13px;line-height:1.6;color:#7a818d;max-width:300px;margin:0 0 20px}\n.socials{display:flex;gap:10px}\n.socials a{width:36px;height:36px;border:1px solid #3a4150;display:flex;align-items:center;justify-content:center;color:#B6BAC2}\n.socials a:hover{background:var(--red);border-color:var(--red);color:#fff}\n.copyline{max-width:1600px;margin:40px auto 0;padding-top:20px;border-top:1px solid #2a313c;display:flex;justify-content:space-between;font-size:12px;color:#7a818d}\n\n/* ============ THUMB COLORS (shared cardgrid) ============ */\n.thumb-pattern{position:absolute;inset:0;opacity:.14;background-image:repeating-linear-gradient(135deg,transparent 0 14px,#fff 14px 15px)}\n\n<\u002Fstyle>\n<style data-v3>\n/* ============ v3 SHARED STYLES — search hero + chrome ============ */\n/* Hero (same across all 4 v3 concepts) */\n.hero{max-width:1280px;margin:0 auto;padding:56px 40px 24px;text-align:center}\n.kicker{font-family:\"JetBrains Mono\",monospace;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--red);margin-bottom:16px;display:inline-flex;align-items:center;gap:10px}\n.kicker::before,.kicker::after{content:\"\";width:24px;height:1px;background:var(--red);display:inline-block}\n.hero h1{font-size:48px;font-weight:700;letter-spacing:-0.025em;margin:0 0 12px;color:var(--g5);line-height:1.05}\n.hero h1 .accent{color:var(--red)}\n.hero .sub{font-size:16px;color:var(--g4);max-width:600px;margin:0 auto 32px;line-height:1.5}\n.search-shell{max-width:760px;margin:0 auto;position:relative}\n.search-big{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--g5);height:60px;padding:0 22px;border-radius:2px;box-shadow:0 10px 28px -10px rgba(40,46,55,.12)}\n.search-big .ms{color:var(--g5);font-size:24px}\n.search-big input{flex:1;border:0;outline:0;font:inherit;font-size:17px;color:var(--g5);background:transparent}\n.search-big input::placeholder{color:var(--g3)}\n.search-big kbd{font-family:\"JetBrains Mono\",monospace;font-size:11px;color:var(--g4);border:1px solid var(--g2);padding:3px 6px;border-radius:2px;background:var(--g1)}\n\n.suggest-row{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--g4)}\n.suggest-row .lbl{font-family:\"JetBrains Mono\",monospace;font-size:11px;color:var(--g4);text-transform:uppercase;letter-spacing:0.1em;font-weight:500}\n.suggest-row .sug{background:#fff;border:1px solid var(--line);padding:5px 11px;font-size:12.5px;color:var(--g5);font-weight:500;cursor:poin ;\n        t.classList.add('on');\n      });\n    });\n  })();\n<\\/script>\n\n<script>\n/* ============ SEARCH TYPEAHEAD (v3) ============ */\n(function(){\n  var ITEMS = [\n    {type:'template', topic:'Risk management',          title:'AI ethics board agenda and discussion template'},\n    {type:'video',    topic:'Risk management',          title:'Developing risk appetite: a framework for boards'},\n    {type:'course',   topic:'Risk management',          title:'Cybersecurity oversight for non-technical directors'},\n    {type:'path',     topic:'Board leadership',         title:'The first-time board director — a foundational path'},\n    {type:'template', topic:'Board leadership',         title:'Shareholder resolution tracker template'},\n    {type:'video',    topic:'Board leadership',         title:'Annual general meetings (AGMs) explained'},\n    {type:'template', topic:'Risk management',          title:'EU AI Act board readiness checklist'},\n    {type:'course',   topic:'Risk management',          title:'NIS2 board oversight playbook'},\n    {type:'video',    topic:'Regulations & compliance', title:'Climate-risk disclosure walkthrough under CSRD'},\n    {type:'path',     topic:'Regulations & compliance', title:'IPO readiness — a 12-month roadmap'},\n    {type:'template', topic:'Entity management',        title:'Subsidiary governance dashboard'},\n    {type:'course',   topic:'Board leadership',         title:'Executive compensation in 2026'},\n    {type:'template', topic:'Regulations & compliance', title:'Conflict of interest declaration — annual review'},\n    {type:'template', topic:'Risk management',          title:'Enterprise risk register — board-level view'},\n    {type:'video',    topic:'Risk management',          title:'Three lines of defence: still fit for purpose?'},\n    {type:'course',   topic:'Entity management',        title:'Entity management essentials for company secretaries'},\n    {type:'template', topic:'Entity management',        title:'Statutory filings calendar'},\n    {type:'video',    topic:'Entity management',        title:'Rationalising your group structure'},\n    {type:'template', topic:'Board leadership',         title:'Board pack agenda — quarterly'},\n    {type:'template', topic:'Board leadership',         title:'Board evaluation questionnaire'},\n    {type:'video',    topic:'Board leadership',         title:'Designing effective committees'},\n    {type:'course',   topic:'Regulations & compliance', title:'CSRD: what boards need to know'},\n    {type:'video',    topic:'Regulations & compliance', title:'Sanctions screening under EU pressure'},\n    {type:'template', topic:'Board leadership',         title:'Board skills matrix and competency assessment'},\n    {type:'template', topic:'Risk management',          title:'Cyber-risk dashboard template'},\n    {type:'video',    topic:'Risk management',          title:'ESG reporting under CSRD — what boards need to know'},\n    {type:'course',   topic:'Risk management',          title:'Quantifying operational risk for boards'},\n    {type:'path',     topic:'Risk management',          title:'From risk register to board paper'},\n    {type:'template', topic:'Board leadership',         title:'Director induction checklist — first 90 days'},\n    {type:'template', topic:'Regulations & compliance', title:'Whistleblowing policy — UK & EU template'},\n    {type:'course',   topic:'Board leadership',         title:'Chairing the AGM — a practitioner course'}\n  ];\n  var ICONS  = {template:'description', course:'school', video:'play_circle', path:'route'};\n  var LABELS = {template:'Template',    course:'Course', video:'Video',       path:'Learning path'};\n\n  function esc(s){ return String(s).replace(/[<>&\"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','\"':'&quot;'}[c]; }); }\n  function regexEsc(s){ return s.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&'); }\n  function highlight(text, q){\n    if (!q) return esc(text);\n    var safe = esc(text);\n    var safeQ = regexEsc(esc(q));\n    return safe.replace(new RegExp('('+safeQ+')', 'ig'), '<mark>$1<\u002Fmark>');\n  }\n\n  function init(input){\n    if (input.dataset.sdInit) return;\n    input.dataset.sdInit = '1';\n    var shell = input.closest('.search-shell');\n    if (!shell){\n      shell = input.parentNode;\n      shell.style.position = 'relative';\n    }\n    var dd = document.createElement('div');\n    dd.className = 'search-dropdown';\n    shell.appendChild(dd);\n\n    var activeIdx = -1;\n    var matches = [];\n\n    function render(q){\n      q = (q || '').trim();\n      if (!q){ dd.classList.remove('on'); dd.innerHTML=''; return; }\n      var lower = q.toLowerCase();\n      matches = ITEMS.filter(function(it){\n        return it.title.toLowerCase().indexOf(lower) !== -1\n            || it.topic.toLowerCase().indexOf(lower) !== -1\n            || LABELS[it.type].toLowerCase().indexOf(lower) !== -1;\n      });\n      activeIdx = -1;\n      var top = matches.slice(0, 7);\n      var html = '';\n      if (top.length === 0){\n        html = '<div class=\"sd-empty\"><span class=\"ms\">search_off<\u002Fspan>'+\n               '<strong>No matches for &ldquo;'+esc(q)+'&rdquo;<\u002Fstrong>'+\n               'Try a different keyword, or browse the full library.<\u002Fdiv>';\n      } else {\n        html = '<div class=\"sd-label\"><span>Suggestions · '+top.length+' of '+matches.length+'<\u002Fspan><span class=\"kbd\">↑ ↓ to navigate &nbsp;·&nbsp; ↵ to open<\u002Fspan><\u002Fdiv>';\n        top.forEach(function(it, i){\n          html += '<button class=\"sd-row\" data-i=\"'+i+'\">'+\n            '<div class=\"sd-ico t-'+it.type+'\"><span class=\"ms\">'+ICONS[it.type]+'<\u002Fspan><\u002Fdiv>'+\n            '<div class=\"sd-info\">'+\n              '<div class=\"t\">'+highlight(it.title, q)+'<\u002Fdiv>'+\n              '<div class=\"m\">'+esc(LABELS[it.type])+' &middot; '+esc(it.topic)+'<\u002Fdiv>'+\n            '<\u002Fdiv>'+\n            '<div class=\"sd-tag\">'+esc(LABELS[it.type])+'<\u002Fdiv>'+\n          '<\u002Fbutton>';\n        });\n        html += '<button class=\"sd-foot\"><span>Show all '+matches.length+' results for &ldquo;'+esc(q)+'&rdquo;<\u002Fspan><span class=\"ms\">arrow_forward<\u002Fspan><\u002Fbutton>';\n      }\n      dd.innerHTML = html;\n      dd.classList.add('on');\n      // Wire row clicks (visual prototype only — fill input)\n      dd.querySelectorAll('.sd-row').forEach(function(r){\n        r.addEventListener('click', function(){\n          var idx = parseInt(r.dataset.i, 10);\n          if (!isNaN(idx) && matches[idx]){ input.value = matches[idx].title; render(input.value); }\n        });\n      });\n    }\n\n    input.addEventListener('input', function(){ render(input.value); });\n    input.addEventListener('focus', function(){ if (input.value.trim()) render(input.value); });\n\n    document.addEventListener('mousedown', function(e){\n      if (!shell.contains(e.target)) dd.classList.remove('on');\n    });\n\n    input.addEventListener('keydown', function(e){\n      if (!dd.classList.contains('on')) return;\n      var rows = dd.querySelectorAll('.sd-row');\n      if (!rows.length) return;\n      if (e.key === 'ArrowDown'){ e.preventDefault(); activeIdx = (activeIdx + 1) % rows.length; }\n      else if (e.key === 'ArrowUp'){ e.preventDefault(); activeIdx = (activeIdx - 1 + rows.length) % rows.length; }\n      else if (e.key === 'Escape'){ dd.classList.remove('on'); return; }\n      else if (e.key === 'Enter'){ e.preventDefault(); if (rows[activeIdx]) rows[activeIdx].click(); return; }\n      else return;\n      rows.forEach(function(r, i){ r.classList.toggle('on', i === activeIdx); });\n    });\n  }\n\n  function bind(){\n    document.querySelectorAll('.search-big input').forEach(init);\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);\n  else bind();\n})();\n\n<\\/script>\n<\u002Fbody>\n<\u002Fhtml>\n\n<\u002Fscript>\n\n<script>\n(function(){\n  var stage = document.getElementById('stage');\n  var current = null;\n  var cache = {};\n  function load(key){\n    if (current === key) return;\n    current = key;\n    var url = cache[key];\n    if (!url){\n      var src = document.getElementById('c-'+key).textContent;\n      src = src.replace(/<\\\\\\/script/g, '<\u002Fscript');\n      var blob = new Blob([src], {type:'text/html'});\n      url = URL.createObjectURL(blob);\n      cache[key] = url;\n    }\n    stage.src = url;\n    document.querySelectorAll('.tab').forEach(function(t){\n      t.classList.toggle('active', t.dataset.c === key);\n    });\n    history.replaceState(null,'','#v3'+key);\n  }\n  document.querySelectorAll('.tab').forEach(function(b){\n    b.addEventListener('click', function(){ load(b.dataset.c); });\n  });\n  var map = {'1':'A','2':'B','3':'C','4':'D'};\n  document.addEventListener('keydown', function(e){\n    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;\n    if (e.metaKey || e.ctrlKey || e.altKey) return;\n    if (map[e.key]) { e.preventDefault(); load(map[e.key]); }\n  });\n  var hash = (location.hash || '').replace('#v3','').toUpperCase();\n  var keys = ['A','B','C','D'];\n  load(keys.indexOf(hash) >= 0 ? hash : 'A');\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
